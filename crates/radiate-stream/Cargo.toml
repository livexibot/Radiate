[package]
name = "radiate-stream"
description = "Local stream relay and provider connection limiter for Radiate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time", "process", "io-util"] }
tokio-util = "0.7"
tokio-stream = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
url = "2"
serde = { version = "1", features = ["derive"] }
bytes = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
serde_json = "1"
