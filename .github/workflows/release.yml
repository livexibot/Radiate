# Builds the installers for Windows, macOS and Linux and attaches them to
# a release, with the signed update files and latest.json the app's updater
# reads. release-please.yml calls it when a release is created. Running it
# by hand (Actions, Release, Run workflow) or pushing a v* tag makes the
# release itself. Needs the TAURI_SIGNING_PRIVATE_KEY secret.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create, like v0.1.0
        type: string
        required: true
      draft:
        description: Keep the release as a draft (the updater ignores drafts)
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      draft:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  signing-key:
    runs-on: ubuntu-latest
    steps:
      - name: Check the updater signing key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error title=Missing signing key::Add the updater private key as the repository secret TAURI_SIGNING_PRIVATE_KEY (Settings, Secrets and variables, Actions). Without it the release can't be updated to."
            exit 1
          fi

  build:
    needs: signing-key
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || inputs.tag || github.ref }}
      - name: Install Tauri's system libraries
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Install web dependencies
        run: npm ci
        working-directory: apps/desktop
      - name: Fetch the ffmpeg the app installs alongside
        shell: bash
        run: scripts/fetch-ffmpeg.sh ${{ startsWith(matrix.platform, 'windows') && 'windows' || startsWith(matrix.platform, 'macos') && 'macos' || 'linux' }}
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }} --config '{"bundle":{"externalBin":["binaries/radiate-ffmpeg"],"resources":{"licenses/FFMPEG.txt":"licenses/FFMPEG.txt","licenses/GPL-3.0.txt":"licenses/GPL-3.0.txt"}}}'
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Radiate v__VERSION__
          releaseBody: See the changelog for what's new.
          releaseDraft: ${{ inputs.draft == true }}
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
